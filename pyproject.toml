[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwlnet"
version = "0.1.0"
description = "Optimization-aware neural network surrogates: training, pruning, and Pyomo/OMLT/SOSX formulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunoy Sanyal" },
    { name = "Canberk Demir" },
]
keywords = ["neural-networks", "surrogate-models", "optimization", "pyomo", "omlt", "milp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
]

[project.urls]
Repository = "https://github.com/SunoySanyal/PWLNet"
Documentation = "https://github.com/SunoySanyal/PWLNet/blob/main/docs/api_reference.md"
Issues = "https://github.com/SunoySanyal/PWLNet/issues"

[project.optional-dependencies]
optimization = [
    "pyomo",
    "omlt",
    "highspy",
]
highs = [
    "pyomo",
    "omlt",
    "highspy",
]
gurobi = [
    "pyomo",
    "omlt",
    "gurobipy",
]
mosek = [
    "pyomo",
    "mosek",
]
training = [
    "tensorflow",
    "keras",
]
parallel = [
    "ray>=2.9",
    "pyomo",
    "highspy",
]
dev = [
    "matplotlib",
    "pytest",
    "nbformat",
    "nbconvert",
    "jupyter",
    "ipykernel",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
