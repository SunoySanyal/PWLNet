<svg width="1280" height="430" viewBox="0 0 1280 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PWLNet tool stack banner</title>
  <desc id="desc">A generalized tool stack diagram showing training libraries, PWLNet modeling, and optimization solvers.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="ink" x1="70" y1="60" x2="1210" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="0.42" stop-color="#7C3AED"/>
      <stop offset="0.75" stop-color="#059669"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <filter id="shadow" x="-12%" y="-22%" width="124%" height="144%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <style>
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 850; fill: #0F172A; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .stage { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #0F172A; }
      .note { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #64748B; }
      .brand { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 850; fill: #111827; }
      .brandSmall { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #64748B; }
      .chipText { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 750; fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="430" rx="30" fill="url(#bg)"/>

  <g opacity="0.24">
    <path d="M0 86H1280 M0 172H1280 M0 258H1280 M0 344H1280" stroke="#CBD5E1"/>
    <path d="M120 0V430 M240 0V430 M360 0V430 M480 0V430 M600 0V430 M720 0V430 M840 0V430 M960 0V430 M1080 0V430 M1200 0V430" stroke="#CBD5E1"/>
  </g>

  <text x="640" y="48" text-anchor="middle" class="title" font-size="32">PWLNet Tool Stack</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle" font-size="15">Training libraries, modeling layers, and optimization solvers used across the workflows</text>

  <g filter="url(#shadow)">
    <rect x="38" y="116" width="284" height="232" rx="26" fill="url(#panel)" stroke="#38BDF8" stroke-width="2.2"/>
    <text x="180" y="154" text-anchor="middle" class="stage">Train Surrogates</text>
    <text x="180" y="176" text-anchor="middle" class="note">data, scaling, neural networks</text>

    <g>
      <rect x="72" y="204" width="216" height="48" rx="16" fill="#FFF7ED" stroke="#FDBA74"/>
      <path d="M96 229L112 214H128L111 229L128 244H112L96 229Z" fill="#F97316"/>
      <text x="146" y="234" class="brand">TensorFlow</text>
    </g>

    <g>
      <rect x="60" y="266" width="100" height="42" rx="14" fill="#F3E8FF" stroke="#C084FC"/>
      <circle cx="86" cy="287" r="11" fill="#7C3AED"/>
      <text x="106" y="292" class="brand" font-size="16">Keras</text>
    </g>

    <g>
      <rect x="176" y="266" width="130" height="42" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/>
      <path d="M194 298V278L209 288L224 278V298H215V293L209 296L203 293V298H194Z" fill="#0284C7"/>
      <text x="228" y="292" class="brand" font-size="14">NumPy</text>
    </g>
  </g>

  <path d="M342 232H417" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M402 220L420 232L402 244" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="376" y="214" text-anchor="middle" class="note">Network Definition</text>

  <g>
    <rect x="430" y="98" width="812" height="250" rx="28" fill="#FFFFFF" fill-opacity="0.62" stroke="#334155" stroke-width="2.2" stroke-dasharray="10 9"/>
    <text x="1112" y="130" text-anchor="middle" class="stage" fill="#334155">PWLNet package</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="466" y="146" width="318" height="184" rx="24" fill="url(#panel)" stroke="#60A5FA" stroke-width="2"/>
    <text x="625" y="184" text-anchor="middle" class="stage">Model And Embed</text>
    <text x="625" y="206" text-anchor="middle" class="note">Pyomo blocks, OMLT, PWL/SOSX</text>

    <g>
    <rect x="504" y="232" width="120" height="46" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>

    <path d="M516 255L532 239L548 255L532 271L516 255Z" fill="#2563EB"/>
    <path d="M532 239L548 255H532V239Z" fill="#60A5FA"/>

    <text x="556" y="255" class="brand" font-size="17" dominant-baseline="middle">Pyomo</text>
    </g>

    <g>
      <rect x="642" y="232" width="104" height="46" rx="14" fill="#ECFDF5" stroke="#6EE7B7"/>
      <circle cx="666" cy="255" r="13" fill="#059669"/>
      <path d="M657 259L666 244L675 259H657Z" fill="#D1FAE5"/>
      <text x="686" y="261" class="brand" font-size="17">OMLT</text>
    </g>

    <g>
      <rect x="536" y="286" width="178" height="30" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="625" y="306" text-anchor="middle" class="chipText">PWL, SOS2, SOSX</text>
    </g>
  </g>

  <path d="M804 238H867" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M850 226L868 238L850 250" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="833" y="220" text-anchor="middle" class="note">Math Model</text>

  <g filter="url(#shadow)">
    <rect x="884" y="146" width="318" height="184" rx="24" fill="url(#panel)" stroke="#34D399" stroke-width="2"/>
    <text x="1043" y="184" text-anchor="middle" class="stage">Solve And Optimize</text>
    <text x="1043" y="206" text-anchor="middle" class="note">LP, MILP, NLP, MIQP, MISOCP</text>

    <g>
      <rect x="916" y="230" width="132" height="44" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
      <path d="M926 245L944 236L962 245V264L944 273L926 264V245Z" fill="#DC2626"/>
      <path d="M926 245L944 254L962 245" stroke="#FEE2E2" stroke-width="1.4"/>
      <text x="976" y="258" class="brand" font-size="15">Gurobi</text>
    </g>



    <g>
      <rect x="1060" y="230" width="112" height="44" rx="14" fill="#FEFCE8" stroke="#FDE68A"/>
      <circle cx="1082" cy="252" r="13" fill="#F59E0B"/>
      <path d="M1074 252H1090M1082 244V260" stroke="#FFFBEB" stroke-width="2.2" stroke-linecap="round"/>
      <text x="1102" y="258" class="brand" font-size="15">MOSEK</text>
    </g>

    <g>
      <rect x="916" y="286" width="132" height="30" rx="15" fill="#F0FDFA" stroke="#5EEAD4"/>
      <text x="982" y="306" text-anchor="middle" class="chipText">HiGHS</text>
    </g>

    <g>
      <rect x="1060" y="286" width="112" height="30" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="1116" y="306" text-anchor="middle" class="chipText">Ipopt</text>
    </g>
  </g>

  <path d="M184 352C304 394 438 400 560 376C654 358 730 362 828 388C965 425 1082 392 1160 350" stroke="url(#ink)" stroke-width="5" stroke-linecap="round" opacity="0.38"/>

  <g>
    <rect x="230" y="364" width="820" height="38" rx="19" fill="#0F172A" fill-opacity="0.92"/>
    <text x="640" y="388" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#E2E8F0">Generalized stack: data science + neural surrogates + algebraic modeling + mathematical optimization</text>
  </g>
</svg>
