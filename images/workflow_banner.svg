<svg width="1280" height="390" viewBox="0 0 1280 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="100" x2="1160" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.35" stop-color="#A78BFA"/>
      <stop offset="0.7" stop-color="#34D399"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="390" rx="34" fill="url(#bg)"/>

  <!-- Soft color blobs -->
  <circle cx="120" cy="80" r="130" fill="#38BDF8" opacity="0.12"/>
  <circle cx="620" cy="360" r="190" fill="#A78BFA" opacity="0.10"/>
  <circle cx="1130" cy="95" r="160" fill="#34D399" opacity="0.10"/>

  <!-- Subtle grid -->
  <g opacity="0.11">
    <path d="M0 75H1280 M0 150H1280 M0 225H1280 M0 300H1280" stroke="#CBD5E1"/>
    <path d="M100 0V390 M220 0V390 M340 0V390 M460 0V390 M580 0V390 M700 0V390 M820 0V390 M940 0V390 M1060 0V390 M1180 0V390" stroke="#CBD5E1"/>
  </g>

  <!-- Header -->
  <text x="640" y="62" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="36" font-weight="800" fill="#F8FAFC">
    PWLNet Workflow
  </text>

  <text x="640" y="94" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="16" fill="#CBD5E1">
    Neural surrogates → mathematical reformulations → downstream process optimization
  </text>

  <!-- Curved workflow line behind cards -->
  <path d="M130 215 C265 120, 390 310, 520 215 S770 120, 900 215 S1065 305, 1160 215"
        stroke="url(#accent)" stroke-width="6" stroke-linecap="round" opacity="0.62" filter="url(#glow)"/>

  <path d="M1160 215 L1139 203 L1145 227 Z" fill="#FBBF24" opacity="0.85"/>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="190" height="155" rx="24" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.68"/>
    <circle cx="150" cy="176" r="25" fill="#0EA5E9" opacity="0.18" stroke="#38BDF8"/>

    <!-- Centered database icon -->
    <ellipse cx="150" cy="164" rx="15" ry="6" stroke="#E0F2FE" stroke-width="2"/>
    <path d="M135 164V187C135 190.5 141.7 194 150 194C158.3 194 165 190.5 165 187V164" stroke="#E0F2FE" stroke-width="2"/>
    <ellipse cx="150" cy="187" rx="15" ry="6" stroke="#E0F2FE" stroke-width="2"/>

    <text x="150" y="226" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Process Data</text>
    <text x="150" y="251" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">clean • scale • split</text>
    <text x="150" y="272" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#7DD3FC">inputs, states, outputs</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="305" y="135" width="210" height="155" rx="24" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.72"/>
    <circle cx="410" cy="176" r="25" fill="#8B5CF6" opacity="0.18" stroke="#A78BFA"/>

    <!-- Centered neural-network icon -->
    <circle cx="395" cy="169" r="4" fill="#EDE9FE"/>
    <circle cx="395" cy="185" r="4" fill="#EDE9FE"/>
    <circle cx="411" cy="176" r="4" fill="#EDE9FE"/>
    <circle cx="425" cy="166" r="4" fill="#EDE9FE"/>
    <circle cx="425" cy="188" r="4" fill="#EDE9FE"/>
    <path d="M399 170L407 176L399 184M415 175L421 168M415 177L421 186" stroke="#EDE9FE" stroke-width="1.6"/>

    <text x="410" y="223" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="800" fill="#F8FAFC">Train / Prune</text>
    <text x="410" y="247" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="800" fill="#F8FAFC">Physics NN</text>
    <text x="410" y="272" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#C4B5FD">accurate + compact surrogate</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="570" y="135" width="210" height="155" rx="24" fill="url(#card)" stroke="#34D399" stroke-opacity="0.72"/>
    <circle cx="675" cy="176" r="25" fill="#10B981" opacity="0.16" stroke="#34D399"/>
    <path d="M661 188L672 164L681 182L689 171" stroke="#D1FAE5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M659 193H691" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round"/>

    <text x="675" y="223" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#F8FAFC">OMLT / Pyomo-PWL</text>
    <text x="675" y="247" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#F8FAFC">SOSX</text>
    <text x="675" y="272" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#86EFAC">optimization-ready form</text>
  </g>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="835" y="135" width="190" height="155" rx="24" fill="url(#card)" stroke="#FBBF24" stroke-opacity="0.72"/>
    <circle cx="930" cy="176" r="25" fill="#F59E0B" opacity="0.17" stroke="#FBBF24"/>
    <path d="M917 166H943M917 176H943M917 186H935" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round"/>

    <text x="930" y="219" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#F8FAFC">LP / MILP / NLP</text>
    <text x="930" y="242" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#F8FAFC">SOCP Solver</text>
    <text x="930" y="265" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#FDE68A">Gurobi • MOSEK</text>
    <text x="930" y="281" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#FDE68A">IPOPT • CBC</text>
  </g>

  <!-- Card 5 -->
  <g filter="url(#shadow)">
    <rect x="1080" y="135" width="150" height="155" rx="24" fill="url(#card)" stroke="#FB7185" stroke-opacity="0.72"/>
    <circle cx="1155" cy="176" r="25" fill="#F43F5E" opacity="0.16" stroke="#FB7185"/>
    <path d="M1143 185L1152 176L1159 182L1169 167" stroke="#FFE4E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1143" cy="185" r="3" fill="#FFE4E6"/>
    <circle cx="1152" cy="176" r="3" fill="#FFE4E6"/>
    <circle cx="1159" cy="182" r="3" fill="#FFE4E6"/>
    <circle cx="1169" cy="167" r="3" fill="#FFE4E6"/>

    <text x="1155" y="223" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#F8FAFC">Downstream</text>
    <text x="1155" y="247" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#F8FAFC">Optimization</text>
    <text x="1155" y="272" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#FDA4AF">process decisions</text>
  </g>

  <!-- Footer chip -->
  <g opacity="0.96">
    <rect x="250" y="322" width="780" height="36" rx="18" fill="#020617" fill-opacity="0.62" stroke="#334155"/>
    <text x="640" y="345" text-anchor="middle"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="13" fill="#CBD5E1">
      Process data → Train / prune / physics NN → OMLT / Pyomo-PWL / SOSX → LP / MILP / NLP / SOCP solver → Process optimization
    </text>
  </g>
</svg>
